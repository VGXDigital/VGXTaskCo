# VGXTaskCo — local development PostgreSQL service
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: vgxtaskco-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vgxtaskco
      POSTGRES_PASSWORD: vgxtaskco_dev
      POSTGRES_DB: vgxtaskco
    volumes:
      - vgxtaskco_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vgxtaskco -d vgxtaskco"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  vgxtaskco_pgdata:
    driver: local
