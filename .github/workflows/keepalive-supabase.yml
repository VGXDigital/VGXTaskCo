# VGXTaskCo — Keep-alive: queries the Supabase keepalive table to prevent the free-tier project from pausing.

name: Keep-Alive Supabase

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:        # manual trigger for testing

jobs:
  ping-supabase:
    name: Ping Supabase keepalive table
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase keepalive table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sf -w "\nSupabase keepalive status: %{http_code}\n" \
            "${SUPABASE_URL}/rest/v1/keepalive?select=*" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
