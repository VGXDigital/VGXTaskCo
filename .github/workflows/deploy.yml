# VGXTaskCo — Deploy to VPS

name: Deploy to VPS

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  API_IMAGE: vgxconsulting/taskco-api
  WEB_IMAGE: vgxconsulting/taskco-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:v${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:v${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/HostedSites/tasks.vgx.digital; or exit 1

            # Pull latest images
            docker pull vgxconsulting/taskco-api:latest; or exit 1
            docker pull vgxconsulting/taskco-web:latest; or exit 1

            # Deploy with compose (recreates only changed containers)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans; or exit 1

            # Wait for web container health (api healthy is a prerequisite via depends_on)
            echo "Waiting for containers to become healthy..."
            set -l max_attempts 12
            set -l attempt 0
            while test $attempt -lt $max_attempts
              set attempt (math $attempt + 1)
              if docker inspect --format='{{.State.Health.Status}}' vgxtaskco-web 2>/dev/null | grep -q healthy
                echo "Deployment healthy after $attempt attempts"
                break
              end
              if test $attempt -eq $max_attempts
                echo "Container failed to become healthy"
                docker logs --tail 50 vgxtaskco-web
                docker logs --tail 50 vgxtaskco-api
                exit 1
              end
              sleep 5
            end

            echo "Deployment successful"
            docker image prune -f
