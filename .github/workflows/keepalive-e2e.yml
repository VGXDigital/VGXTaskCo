# vgx-taskco — Keep-alive: runs the Playwright E2E suite against production daily
# to prevent the Neon database free-tier from going dormant.

name: Keep-Alive E2E

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:        # manual trigger for testing

jobs:
  e2e-production:
    name: Playwright vs production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E against production
        continue-on-error: true
        env:
          E2E_ENV: prod
          E2E_BASE_URL: https://vgxtaskco-api.fly.dev
          E2E_FRONTEND_URL: https://taskco.vgx.guru
        run: pnpm test:features

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            tests/feature-matrix-report.json
          retention-days: 7
