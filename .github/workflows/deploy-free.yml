# Auto-deploy backend to Fly.io on every push to main.
# Vercel handles the frontend automatically via GitHub integration — no job needed here.

name: Deploy Free Tier (Fly.io)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-fly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        run: curl -L https://fly.io/install.sh | sh

      - name: Deploy to Fly.io
        run: ~/.fly/bin/flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
